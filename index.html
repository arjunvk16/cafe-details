<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Food Confessional</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-primary: #ff4757;
            --accent-secondary: #00d2d3;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            /* Sarcastic Rating Colors */
            --excellent: #10b981;
            --good: #3b82f6;
            --average: #f59e0b;
            --bad: #ef4444;
        }

        * {
            box-sizing: border-box;
            transition: all 0.2s ease-in-out;
            -webkit-tap-highlight-color: transparent; /* Removes ugly mobile flash */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            max-width: 650px;
            margin: 0 auto;
            padding: 20px 15px;
            line-height: 1.5;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(45deg, var(--accent-primary), #ff6b81);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        header p {
            color: var(--text-muted);
            font-style: italic;
            margin: 0;
            font-size: 0.95rem;
        }

        .container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.3);
            margin-bottom: 25px;
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            border-radius: 16px 16px 0 0;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            position: relative; /* Crucial for the custom dropdown positioning */
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-secondary);
        }

        input, textarea, select {
            background: #0f172a;
            color: var(--text-main);
            padding: 14px;
            border: 2px solid #334155;
            border-radius: 8px;
            font-size: 16px; /* 16px prevents iOS from forcing an ugly auto-zoom */
            font-family: inherit;
            width: 100%;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px rgba(255, 71, 87, 0.15);
        }

        /* CUSTOM MOBILE SUGGESTIONS DROPDOWN */
        .suggestions-box {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: #1e293b;
            border: 2px solid #475569;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 999;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: none; /* Hidden by default */
        }

        .suggestion-item {
            padding: 12px 14px;
            cursor: pointer;
            border-bottom: 1px solid #334155;
            font-size: 0.95rem;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hidden-touch, .suggestion-item:hover {
            background: #334155;
            color: var(--accent-secondary);
        }

        button {
            cursor: pointer;
            font-weight: 800;
            font-size: 16px;
            padding: 14px;
            border-radius: 8px;
            border: none;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-height: 48px; /* Safe mobile tap target size */
        }

        #submit-btn {
            background: linear-gradient(135deg, var(--accent-primary), #ff6b81);
            color: white;
            box-shadow: 0 4px 14px rgba(255, 71, 87, 0.3);
        }

        .cancel-edit-btn {
            background: #475569;
            color: var(--text-main);
        }

        .search-bar {
            width: 100%;
            margin-bottom: 20px;
            background: var(--card-bg);
            border: 2px solid #334155;
        }

        /* MOBILE RESPONSIVE CARDS */
        .entry-card {
            background: var(--card-bg);
            border: 1px solid #334155;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .entry-title {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .entry-place {
            color: var(--accent-secondary);
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 2px;
        }

        .entry-details {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-muted);
            word-break: break-word; /* Prevents overflow strings breaking layout */
        }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #fff;
            white-space: nowrap;
        }
        .badge-excellent { background-color: var(--excellent); }
        .badge-good { background-color: var(--good); }
        .badge-average { background-color: var(--average); color: #0f172a; }
        .badge-bad { background-color: var(--bad); }

        /* Actions block sits beautifully below text on mobile */
        .card-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 5px;
            border-top: 1px solid #334155;
            padding-top: 12px;
        }

        .edit-btn, .delete-btn {
            background: #0f172a;
            border: 1px solid #334155;
            color: var(--text-main);
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            min-height: 38px;
        }

        .edit-btn:active { border-color: var(--accent-secondary); color: var(--accent-secondary); }
        .delete-btn:active { border-color: var(--accent-primary); color: var(--accent-primary); }

        .loader-text {
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            padding: 30px;
            font-size: 0.9rem;
        }

        /* Desktop Media Queries for enhancements */
        @media (min-width: 600px) {
            h1 { font-size: 2.5rem; }
            .entry-card:hover {
                transform: translateY(-2px);
                border-color: #475569;
            }
            .edit-btn:hover { border-color: var(--accent-secondary); color: var(--accent-secondary); }
            .delete-btn:hover { border-color: var(--accent-primary); color: var(--accent-primary); animation: shake 0.2s infinite; }
        }

        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(1deg); }
            75% { transform: rotate(-1deg); }
            100% { transform: rotate(0deg); }
        }
    </style>
</head>
<body>

    <header>
        <h1>The Food Confessional</h1>
        <p>Documenting questionable nutritional milestones and dietary regrets.</p>
    </header>

    <div class="container">
        <form id="add-entry-form" autocomplete="off">
            
            <!-- Upgraded Cafe Input Container -->
            <div class="form-group">
                <label for="place-name">Crime Scene</label>
                <input type="text" id="place-name" placeholder="Where did you do this? (Tap to view past locations)" required>
                <!-- Custom dropdown panel -->
                <div id="suggestions-box" class="suggestions-box"></div>
            </div>
            
            <div class="form-group">
                <label for="food-item">The Evidence</label>
                <input type="text" id="food-item" placeholder="What did you eat? (e.g., Spicy Double Burger)" required>
            </div>
            
            <div class="form-group">
                <label for="rating">Honest Verdict</label>
                <select id="rating" required>
                    <option value="" disabled selected>Rate your momentary life choice...</option>
                    <option value="excellent">Absolute Masterpiece 👑</option>
                    <option value="good">Pretty Decent 👍</option>
                    <option value="average">Meh, kept me alive 😐</option>
                    <option value="bad">Profound regret 🤮</option>
                </select>
            </div>

            <div class="form-group">
                <label for="details">Closing Arguments</label>
                <textarea id="details" rows="2" placeholder="Notes for next time? Extra cheese necessary? Garbage service?"></textarea>
            </div>
            
            <button type="submit" id="submit-btn">Log the Damage 📝</button>
            <button type="button" id="cancel-btn" class="cancel-edit-btn" style="display: none;">Cancel Edit 🛑</button>
        </form>
    </div>

    <input type="text" id="search-input" class="search-bar" placeholder="🔍 Filter past mistakes...">

    <div id="food-list">
        <div class="loader-text">Summoning your culinary timeline...</div>
    </div>

    <!-- Firebase System Module (v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJ9K9fQ0ThMB7aXB6qNHr3_yLUdqJgnCM",
            authDomain: "my-chain-reaction-game.firebaseapp.com",
            projectId: "my-chain-reaction-game",
            storageBucket: "my-chain-reaction-game.appspot.com",
            messagingSenderId: "32751418407",
            appId: "1:32751418407:web:ff8244007ef2b099d56202"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('add-entry-form');
        const submitBtn = document.getElementById('submit-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const listContainer = document.getElementById('food-list');
        const searchInput = document.getElementById('search-input');
        
        // Custom dropdown DOM hooks
        const placeInput = document.getElementById('place-name');
        const suggestionsBox = document.getElementById('suggestions-box');

        let allEntries = [];
        let uniqueCafes = [];
        let editDocId = null; 

        // 1. Submit Handlers
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const place = placeInput.value.trim();
            const food = document.getElementById('food-item').value.trim();
            const rating = document.getElementById('rating').value;
            const details = document.getElementById('details').value.trim();

            submitBtn.disabled = true;
            submitBtn.innerText = "Encrypting data...";

            try {
                if (editDocId) {
                    await updateDoc(doc(db, "eats", editDocId), {
                        placeName: place,
                        foodItem: food,
                        rating: rating,
                        details: details
                    });
                    resetFormState();
                } else {
                    await addDoc(collection(db, "eats"), {
                        placeName: place,
                        foodItem: food,
                        rating: rating,
                        details: details,
                        createdAt: serverTimestamp()
                    });
                    form.reset();
                }
                suggestionsBox.style.display = 'none';
            } catch (error) {
                console.error(error);
                alert("Firebase rejected your snack.");
            } finally {
                submitBtn.disabled = false;
                if(!editDocId) submitBtn.innerText = "Log the Damage 📝";
            }
        });

        // 2. Real-time Firebase Pipeline
        const q = query(collection(db, "eats"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            allEntries = [];
            snapshot.forEach((doc) => {
                allEntries.push({ id: doc.id, ...doc.data() });
            });
            
            // Build absolute distinct list of cafe locations
            uniqueCafes = [...new Set(allEntries.map(entry => entry.placeName))]
                .filter(name => name && name.trim() !== '')
                .sort((a, b) => a.localeCompare(b));

            filterAndRender();
        });

        // 3. CUSTOM SUGGESTIONS RENDERING LOGIC
        function showSuggestions(filterText = '') {
            const searchNormalized = filterText.toLowerCase();
            
            // Filter unique cafes by what the user typed
            const matches = uniqueCafes.filter(cafe => 
                cafe.toLowerCase().includes(searchNormalized)
            );

            if (matches.length === 0) {
                suggestionsBox.style.display = 'none';
                return;
            }

            // Generate elements cleanly
            suggestionsBox.innerHTML = matches
                .map(cafe => `<div class="suggestion-item">${cafe}</div>`)
                .join('');
                
            suggestionsBox.style.display = 'block';

            // Attach touch/click listeners directly inside items
            const items = suggestionsBox.querySelectorAll('.suggestion-item');
            items.forEach(item => {
                item.addEventListener('click', (e) => {
                    placeInput.value = e.target.innerText;
                    suggestionsBox.style.display = 'none';
                });
            });
        }

        // Dropdown interactive triggers
        placeInput.addEventListener('focus', () => showSuggestions(placeInput.value));
        placeInput.addEventListener('input', (e) => showSuggestions(e.target.value));

        // Closes suggestions if you click anywhere else on the mobile screen
        document.addEventListener('click', (e) => {
            if (e.target !== placeInput && e.target !== suggestionsBox) {
                suggestionsBox.style.display = 'none';
            }
        });

        // 4. UI Card Builder (Mobile-First Overhaul)
        function renderList(entries) {
            listContainer.innerHTML = ''; 

            if (entries.length === 0) {
                listContainer.innerHTML = '<div class="loader-text">No matches. Are you currently photosynthesizing? 🌱</div>';
                return;
            }

            entries.forEach(entry => {
                const card = document.createElement('div');
                card.className = 'entry-card';
                
                const ratingTag = entry.rating || 'good'; 
                const niceRatingText = {
                    excellent: "Masterpiece 👑",
                    good: "Decent 👍",
                    average: "Survived 😐",
                    bad: "Regret 🤮"
                }[ratingTag] || "Decent 👍";

                card.innerHTML = `
                    <div class="entry-header">
                        <div>
                            <h3 class="entry-title">${entry.foodItem}</h3>
                            <div class="entry-place">📍 At ${entry.placeName}</div>
                        </div>
                        <span class="badge badge-${ratingTag}">${niceRatingText}</span>
                    </div>
                    ${entry.details ? `<p class="entry-details">“ ${entry.details} ”</p>` : ''}
                    <div class="card-actions">
                        <button class="edit-btn">Edit</button>
                        <button class="delete-btn">Yeet 🗑️</button>
                    </div>
                `;

                // Mobile Friendly Edit Event
                card.querySelector('.edit-btn').addEventListener('click', () => {
                    placeInput.value = entry.placeName;
                    document.getElementById('food-item').value = entry.foodItem;
                    document.getElementById('rating').value = entry.rating || 'good';
                    document.getElementById('details').value = entry.details || '';
                    
                    editDocId = entry.id;
                    submitBtn.innerText = "Rewrite History ⏳";
                    cancelBtn.style.display = "block";
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });

                // Mobile Friendly Confirmed Delete Event
                card.querySelector('.delete-btn').addEventListener('click', async () => {
                    if (confirm(`Purge "${entry.foodItem}" from history? This won't erase the calories.`)) {
                        try {
                            await deleteDoc(doc(db, "eats", entry.id));
                            if (editDocId === entry.id) resetFormState();
                        } catch (e) {
                            alert("Couldn't yeet item.");
                        }
                    }
                });

                listContainer.appendChild(card);
            });
        }

        cancelBtn.addEventListener('click', resetFormState);

        function resetFormState() {
            editDocId = null;
            form.reset();
            submitBtn.innerText = "Log the Damage 📝";
            cancelBtn.style.display = "none";
            suggestionsBox.style.display = 'none';
        }

        function filterAndRender() {
            const searchTerm = searchInput.value.toLowerCase();
            const filtered = allEntries.filter(entry => 
                entry.foodItem.toLowerCase().includes(searchTerm) ||
                entry.placeName.toLowerCase().includes(searchTerm) ||
                (entry.rating || '').toLowerCase().includes(searchTerm)
            );
            renderList(filtered);
        }

        searchInput.addEventListener('input', filterAndRender);
    </script>
</body>
</html>
